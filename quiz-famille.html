<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Trouve sa maison</title>
<style>
  :root{
    --rouge: #2E86DE;
    --rouge-fonce: #1B5FA8;
    --bleu: #0F1E30;
    --bleu-clair: #18314D;
    --glace: #EDF1F5;
    --acier: #081220;
    --acier-clair: #142238;
    --or: #D9A441;
    --texte: #EDF1F5;
    --texte-att: #8FA6C4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    background: radial-gradient(1200px 600px at 50% -10%, rgba(46,134,222,0.20), transparent 60%), var(--acier);
    color:var(--texte);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    touch-action:pan-y;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 0 40px;}
  header{padding:26px 20px 16px;text-align:center;}
  .eyebrow{font-size:13px;color:var(--texte-att);margin:0 0 6px;}
  h1{
    font-family:"Arial Narrow",Arial,sans-serif;
    font-weight:900;font-stretch:condensed;font-size:38px;line-height:0.95;
    margin:0;letter-spacing:0.5px;color:var(--glace);text-transform:uppercase;
    text-shadow:0 2px 0 rgba(0,0,0,0.25);
  }
  h1 span{color:var(--rouge);}
  .centerline{height:3px;margin:16px auto 0;max-width:560px;background:linear-gradient(90deg, transparent, var(--rouge) 15%, var(--rouge) 85%, transparent);position:relative;}
  .centerline::after{content:"";position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);border:3px solid var(--rouge);border-radius:50%;background:var(--acier);}

  .tabs{display:flex;gap:8px;padding:0 16px;margin-top:16px;}
  .tabbtn{flex:1;background:var(--acier-clair);color:var(--texte-att);border:none;border-radius:10px;padding:11px 6px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .tabbtn.active{background:var(--rouge);color:#fff;}

  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0;gap:10px;}
  .pill{background:var(--acier-clair);border-radius:999px;padding:8px 14px;font-size:13.5px;color:var(--texte-att);}
  .pill b{color:var(--glace);}
  .coinpill{background:linear-gradient(90deg, rgba(217,164,65,0.18), rgba(217,164,65,0.05));border:1px solid rgba(217,164,65,0.35);}
  .coinpill b{color:var(--or);}
  .btn{border:none;cursor:pointer;font-weight:700;border-radius:10px;padding:10px 16px;font-size:14px;}
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:var(--rouge);color:#fff;}
  .btn-ghost{background:transparent;color:var(--texte-att);border:1px solid #234061;}

  .instructions{text-align:center;font-size:13px;color:var(--texte-att);padding:12px 24px 0;}

  .zones{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 16px 0;}
  .dropzone{
    background:var(--bleu);
    border:2px dashed #2A4A70;
    border-radius:14px;
    padding:12px 8px;
    text-align:center;
    min-height:88px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:background .15s ease, border-color .15s ease;
  }
  .dropzone.hover{background:var(--bleu-clair);border-color:var(--rouge);}
  .dropzone .zicon{font-size:26px;}
  .dropzone .zname{font-size:12px;font-weight:700;color:var(--glace);margin-top:4px;}
  .dropzone .zprog{font-size:11px;color:var(--texte-att);margin-top:2px;}
  .dropzone.complete{border-style:solid;border-color:#3FBF74;background:rgba(63,191,116,0.12);}

  .tray{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    padding:20px 16px 0;
    min-height:70px;
  }
  .tile{
    width:56px;height:56px;
    background:var(--acier-clair);
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:28px;
    cursor:grab;
    touch-action:none;
    user-select:none;
    box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }
  .tile.text{
    width:auto;
    min-width:74px;
    padding:0 12px;
    font-size:13.5px;
    font-weight:800;
    color:var(--glace);
  }
  .tile.dragging{cursor:grabbing;box-shadow:0 8px 20px rgba(0,0,0,0.5);transform:scale(1.08);}
  .tile.wrong-flash{animation:shake .4s;background:#7E1522;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }

  .overlay{position:fixed;inset:0;background:rgba(4,8,14,0.9);display:none;align-items:center;justify-content:center;padding:24px;z-index:20;}
  .overlay.show{display:flex;}
  .overlaycard{background:var(--bleu);border-radius:18px;padding:26px 22px 22px;text-align:center;max-width:360px;width:100%;}
  .overlaycard h3{margin:0 0 8px;font-size:22px;color:var(--glace);}
  .overlaycard p{margin:0 0 18px;color:#A9C1DE;font-size:13.5px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Glisse chaque élément vers la bonne catégorie</p>
    <h1>Jeu<br><span>d'Association</span></h1>
    <div class="centerline"></div>
  </header>

  <div class="tabs">
    <button class="tabbtn themebtn active" data-theme="animaux">🐾 Animaux</button>
    <button class="tabbtn themebtn" data-theme="drapeaux">🚩 Drapeaux</button>
    <button class="tabbtn themebtn" data-theme="aliments">🍎 Aliments</button>
    <button class="tabbtn themebtn" data-theme="mots">🔤 Mots</button>
  </div>

  <div class="tabs">
    <button class="tabbtn diffbtn" data-diff="facile">Facile</button>
    <button class="tabbtn diffbtn active" data-diff="normal">Normal</button>
    <button class="tabbtn diffbtn" data-diff="difficile">Difficile</button>
  </div>

  <div class="statusbar">
    <div class="pill coinpill">Pièces&nbsp;<b id="coinCount">20</b></div>
    <div class="pill">Erreurs&nbsp;<b id="mistakeCount">0</b></div>
    <button class="btn btn-ghost" id="newGameBtn">Nouvelle partie</button>
  </div>

  <p class="instructions">Touche un élément et glisse-le jusqu'à la bonne catégorie.</p>

  <div class="zones" id="zones"></div>
  <div class="tray" id="tray"></div>
</div>

<div class="overlay" id="overlay">
  <div class="overlaycard">
    <h3>Bravo! 🎉</h3>
    <p id="resultText">Tous les animaux sont chez eux!</p>
    <button class="btn btn-primary" id="playAgainBtn" style="width:100%;">Rejouer</button>
  </div>
</div>

<script>
const THEMES = {
  animaux: {
    label: 'Animaux', type: 'emoji',
    categories: {
      ferme:   {name:'Ferme',    icon:'🚜', items:['🐄','🐷','🐔','🐑','🐴']},
      foret:   {name:'Forêt',    icon:'🌲', items:['🦊','🐻','🦌','🐿️','🦔']},
      ocean:   {name:'Océan',    icon:'🌊', items:['🐳','🐬','🐙','🐠','🦀']},
      jungle:  {name:'Jungle',   icon:'🌴', items:['🦁','🐒','🐍','🦜','🐆']},
      arctique:{name:'Arctique', icon:'❄️', items:['🐧','🦭','🐻\u200d❄️']}
    }
  },
  drapeaux: {
    label: 'Drapeaux', type: 'emoji',
    categories: {
      europe:   {name:'Europe',   icon:'🏰', items:['🇫🇷','🇩🇪','🇮🇹','🇪🇸','🇬🇧']},
      amerique: {name:'Amérique', icon:'🗽', items:['🇨🇦','🇺🇸','🇧🇷','🇲🇽','🇦🇷']},
      asie:     {name:'Asie',     icon:'🏯', items:['🇯🇵','🇨🇳','🇮🇳','🇰🇷','🇹🇭']},
      afrique:  {name:'Afrique',  icon:'🌍', items:['🇪🇬','🇿🇦','🇰🇪','🇲🇦','🇳🇬']}
    }
  },
  aliments: {
    label: 'Aliments', type: 'emoji',
    categories: {
      fruits:    {name:'Fruits',     icon:'🍏', items:['🍎','🍌','🍇','🍓','🍊']},
      legumes:   {name:'Légumes',    icon:'🥦', items:['🥕','🥦','🥬','🌽','🍅']},
      proteines: {name:'Protéines',  icon:'🍗', items:['🍗','🥩','🐟','🥚','🫘']},
      feculents: {name:'Féculents',  icon:'🍞', items:['🍞','🍚','🍝','🥔','🌾']}
    }
  },
  mots: {
    label: 'Mots', type: 'text',
    categories: {
      noms:       {name:'Noms',       icon:'📦', items:['Chat','Maison','École','Ballon','Arbre']},
      verbes:     {name:'Verbes',     icon:'🏃', items:['Courir','Manger','Dormir','Chanter','Sauter']},
      adjectifs:  {name:'Adjectifs',  icon:'✨', items:['Grand','Joli','Rapide','Heureux','Froid']}
    }
  }
};
let theme = 'animaux';

function getDifficultyConfig(){
  const catKeys = Object.keys(THEMES[theme].categories);
  if(difficulty === 'facile')    return { cats: catKeys.slice(0, 2), perCat: 2 };
  if(difficulty === 'normal')    return { cats: catKeys.slice(0, Math.min(3, catKeys.length)), perCat: 3 };
  return { cats: catKeys, perCat: 3 };
}
let difficulty = 'normal';

const COIN_STORAGE_KEY = 'quiEstCeCoinsGlobal';
function loadSavedCoins(){
  try{ const s=localStorage.getItem(COIN_STORAGE_KEY); if(s!==null){ const n=parseInt(s,10); if(!isNaN(n)) return n; } }catch(e){}
  return 20;
}
let coinBalance = loadSavedCoins();
const coinCountEl = document.getElementById('coinCount');
coinCountEl.textContent = coinBalance;
function saveCoins(){ try{ localStorage.setItem(COIN_STORAGE_KEY, String(coinBalance)); }catch(e){} }
function addCoins(n){ coinBalance += n; coinCountEl.textContent = coinBalance; saveCoins(); }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

document.querySelectorAll('.diffbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    difficulty = btn.dataset.diff;
    document.querySelectorAll('.diffbtn').forEach(b=>b.classList.toggle('active', b===btn));
    startGame();
  });
});

document.querySelectorAll('.themebtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    theme = btn.dataset.theme;
    document.querySelectorAll('.themebtn').forEach(b=>b.classList.toggle('active', b===btn));
    startGame();
  });
});

const zonesEl = document.getElementById('zones');
const trayEl = document.getElementById('tray');
const mistakeCountEl = document.getElementById('mistakeCount');

let allTiles = [];
let totalTiles = 0;
let placedTiles = 0;
let mistakes = 0;
let zoneProgress = {};
let zoneTotals = {};

function startGame(){
  const cfg = getDifficultyConfig();
  const themeData = THEMES[theme];
  mistakes = 0;
  placedTiles = 0;
  mistakeCountEl.textContent = 0;
  zoneProgress = {};
  zoneTotals = {};

  allTiles = [];
  cfg.cats.forEach(ckey=>{
    const c = themeData.categories[ckey];
    const chosen = shuffle(c.items).slice(0, cfg.perCat);
    zoneTotals[ckey] = chosen.length;
    zoneProgress[ckey] = 0;
    chosen.forEach(icon=> allTiles.push({icon, habitat:ckey}));
  });
  totalTiles = allTiles.length;
  allTiles = shuffle(allTiles);

  zonesEl.style.gridTemplateColumns = cfg.cats.length <= 2 ? '1fr 1fr' : (cfg.cats.length >=5 ? 'repeat(3,1fr)' : 'repeat(2,1fr)');
  zonesEl.innerHTML = cfg.cats.map(ckey=>{
    const c = themeData.categories[ckey];
    return `<div class="dropzone" data-habitat="${ckey}">
      <div class="zicon">${c.icon}</div>
      <div class="zname">${c.name}</div>
      <div class="zprog" id="zprog-${ckey}">0/${zoneTotals[ckey]}</div>
    </div>`;
  }).join('');

  renderTray();
}

function renderTray(){
  const isText = THEMES[theme].type === 'text';
  trayEl.innerHTML = '';
  allTiles.forEach((tileData, idx)=>{
    const el = document.createElement('div');
    el.className = 'tile' + (isText ? ' text' : '');
    el.textContent = tileData.icon;
    el.dataset.idx = idx;
    trayEl.appendChild(el);
    makeDraggable(el, tileData);
  });
}

function makeDraggable(tileEl, animal){
  let dragging = false;
  let offsetX = 0, offsetY = 0;
  let lastZone = null;

  tileEl.addEventListener('pointerdown', (e)=>{
    dragging = true;
    tileEl.setPointerCapture(e.pointerId);
    const rect = tileEl.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    tileEl.style.position = 'fixed';
    tileEl.style.left = rect.left + 'px';
    tileEl.style.top = rect.top + 'px';
    tileEl.style.width = rect.width + 'px';
    tileEl.style.height = rect.height + 'px';
    tileEl.style.zIndex = 1000;
    tileEl.classList.add('dragging');
  });

  tileEl.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    tileEl.style.left = (e.clientX - offsetX) + 'px';
    tileEl.style.top = (e.clientY - offsetY) + 'px';

    const zones = document.querySelectorAll('.dropzone');
    let hovered = null;
    zones.forEach(z=>{
      const r = z.getBoundingClientRect();
      if(e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom){
        hovered = z;
      }
    });
    if(lastZone && lastZone !== hovered) lastZone.classList.remove('hover');
    if(hovered) hovered.classList.add('hover');
    lastZone = hovered;
  });

  tileEl.addEventListener('pointerup', (e)=>{
    if(!dragging) return;
    dragging = false;
    tileEl.classList.remove('dragging');
    if(lastZone) lastZone.classList.remove('hover');

    const zones = document.querySelectorAll('.dropzone');
    let landed = null;
    zones.forEach(z=>{
      const r = z.getBoundingClientRect();
      if(e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom){
        landed = z;
      }
    });
    handleDrop(tileEl, animal, landed);
  });
}

function handleDrop(tileEl, animal, zoneEl){
  tileEl.style.position = '';
  tileEl.style.left = '';
  tileEl.style.top = '';
  tileEl.style.width = '';
  tileEl.style.height = '';
  tileEl.style.zIndex = '';

  if(zoneEl && zoneEl.dataset.habitat === animal.habitat){
    tileEl.remove();
    placedTiles++;
    zoneProgress[animal.habitat]++;
    const progEl = document.getElementById('zprog-' + animal.habitat);
    if(progEl) progEl.textContent = `${zoneProgress[animal.habitat]}/${zoneTotals[animal.habitat]}`;
    if(zoneProgress[animal.habitat] >= zoneTotals[animal.habitat]){
      zoneEl.classList.add('complete');
    }
    checkComplete();
  } else if(zoneEl){
    mistakes++;
    mistakeCountEl.textContent = mistakes;
    tileEl.classList.add('wrong-flash');
    setTimeout(()=>tileEl.classList.remove('wrong-flash'), 400);
  }
}

function checkComplete(){
  if(placedTiles < totalTiles) return;
  const reward = Math.max(10, 30 - mistakes*3);
  addCoins(reward);
  document.getElementById('resultText').textContent = `Tous les animaux sont chez eux, avec ${mistakes} erreur${mistakes!==1?'s':''}! +${reward} pièces`;
  document.getElementById('overlay').classList.add('show');
}

document.getElementById('playAgainBtn').addEventListener('click', ()=>{
  document.getElementById('overlay').classList.remove('show');
  startGame();
});
document.getElementById('newGameBtn').addEventListener('click', startGame);

startGame();
</script>
</body>
</html>
